# dsh-auth-proxy bundle patch: inserts the auth-proxy plugin row into the
# web profile roster. Activate with
#   dsh plugin --profile web add link:<abs path>/dsh-auth-proxy
#
# The plugin is host-only (no client half): it owns the listen socket
# (127.0.0.1:8443 by default), shows the built-in login page, and forwards
# authenticated HTTP + WebSocket traffic to the loopback webserver. The
# webserver itself stays on 127.0.0.1, so no dsh source or --host flag is
# needed.
#
# SECURITY: the proxy offers no TLS, so the listen host must be loopback or a
# private/LAN address — 0.0.0.0, :: and public IPs are refused (see
# listenHostIssue). For external access, terminate TLS in front (reverse
# proxy) and keep this listener on 127.0.0.1.
#
# All values below are also editable live in the Web UI under
# Settings > Plugin config > dsh-auth-proxy (dsh-settings service).
#
# Brand layer (brand.*): a pure proxy-forward rewrite — the loopback webserver
# itself is never touched, so internal LAN access to 127.0.0.1:3080 keeps the
# stock DSH look. Master switch `brand.enabled`; sub-toggles `brand.title`
# (tab title + PWA name/short_name), `brand.logo` (Copilot sidebar/hero slots
# via the official brand graph entry), and `brand.icon` (favicon + PWA icons;
# inline SVG or a host SVG file, empty = default sparkle). The legacy flat
# `brandTitle` still maps onto brand.title when brand.title is empty.
#
# SECURITY: set the token via environment reference, not a literal:
#   token: !!js process.env.DSH_AUTH_TOKEN
# Until a real token is configured (empty or the placeholder 'change-me'),
# the proxy stays DISABLED — it never listens with a well-known token.
- insert:
    - id: auth-proxy
      name: '@wxyzh/dsh-auth-proxy'
      config:
        enabled: true
        host: '127.0.0.1'
        port: 8443
        targetHost: '127.0.0.1'
        targetPort: 3080
        brand:
          enabled: false
          title: 'Harness'
          wordmark: 'Copilot'
          logo: false
          icon:
            inline: ''
            file: ''
        token: !!js process.env.DSH_AUTH_TOKEN ?? 'change-me'
        banner: ''
        allowedIps: []
        accessUrls: []
        maxFailures: 0
        lockoutMinutes: 15
